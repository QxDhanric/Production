<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>QxDhanric is moving</title>

  <style>
    :root{
      --bg:#f4f1ea;
      --text:#111111;
      --muted:#6f6b64;
      --line:rgba(17,17,17,.14);
      --accent:#111111;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      overflow:hidden;
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      padding:28px 36px 30px;
      position:relative;
      isolation:isolate;
    }

    .grain{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.15;
      z-index:-1;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(0,0,0,.05) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 65%, rgba(0,0,0,.035) 0 1px, transparent 1px);
      background-size:13px 13px, 17px 17px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .brand{
      display:flex;
      align-items:center;
    }

    .brand img{
      display:block;
      height:28px;
      width:auto;
      object-fit:contain;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
    }

    .dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--text);
      animation:pulse 1.8s ease-in-out infinite;
    }

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:60px 0;
    }

    .content{
      width:min(100%, 1050px);
    }

    .eyebrow{
      font-size:11px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:28px;
      opacity:0;
      transform:translateY(12px);
      animation:reveal .7s ease forwards .1s;
    }

    h1{
      margin:0;
      font-size:clamp(46px, 9vw, 132px);
      line-height:.89;
      letter-spacing:-.065em;
      font-weight:700;
      opacity:0;
      transform:translateY(18px);
      animation:reveal .8s cubic-bezier(.2,.8,.2,1) forwards .2s;
    }

    h1 span{
      display:block;
    }

    .old{
      color:#969187;
      text-decoration:line-through;
      text-decoration-thickness:.045em;
    }

    .arrow{
      display:inline-block;
      font-weight:400;
      font-size:.7em;
      margin:.16em 0 .08em;
      transform:rotate(90deg);
    }

    .new{
      color:var(--text);
    }

    .message{
      max-width:590px;
      margin:34px auto 0;
      font-size:clamp(15px, 1.6vw, 19px);
      line-height:1.65;
      color:var(--muted);
      opacity:0;
      transform:translateY(12px);
      animation:reveal .7s ease forwards .45s;
    }

    .message strong{
      color:var(--text);
      font-weight:600;
    }

    .new-link{
      color:inherit;
      text-decoration:none;
      position:relative;
      display:inline-block;
    }

    .new-link::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-0.08em;
      height:2px;
      background:currentColor;
      transform:scaleX(0);
      transform-origin:right;
      transition:transform .3s ease;
    }

    .new-link:hover::after,
    .new-link:focus-visible::after{
      transform:scaleX(1);
      transform-origin:left;
    }

    .cta{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-top:28px;
      padding:14px 18px;
      border:1px solid var(--text);
      color:var(--text);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:11px;
      transition:background .25s ease,color .25s ease;
    }

    .cta:hover,
    .cta:focus-visible{
      background:var(--text);
      color:var(--bg);
    }

    footer{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:24px;
      padding-top:20px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .countdown{
      color:var(--text);
    }

    @keyframes reveal{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes pulse{
      0%,100%{opacity:.3; transform:scale(.85)}
      50%{opacity:1; transform:scale(1)}
    }

    @media (max-width:700px){
      html,body{
        min-height:100%;
      }

      body{
        overflow:auto;
      }

      .page{
        min-height:100svh;
        padding:18px 16px 20px;
      }

      header{
        font-size:9px;
        letter-spacing:.1em;
      }

      .brand img{
        height:22px;
        max-width:140px;
      }

      .status{
        gap:6px;
        white-space:nowrap;
      }

      main{
        padding:54px 0 44px;
      }

      .eyebrow{
        font-size:9px;
        margin-bottom:22px;
      }

      h1{
        font-size:clamp(38px, 14vw, 68px);
        line-height:.94;
        letter-spacing:-.055em;
        overflow-wrap:anywhere;
      }

      .arrow{
        margin:.22em 0 .14em;
        font-size:.64em;
      }

      .message{
        margin-top:24px;
        padding:0 4px;
        font-size:14px;
        line-height:1.55;
        max-width:360px;
      }

      .cta{
        margin-top:22px;
        padding:13px 15px;
        font-size:10px;
      }

      footer{
        align-items:flex-start;
        flex-direction:column;
        gap:8px;
        font-size:8px;
        letter-spacing:.07em;
      }
    }

    @media (max-width:390px){
      .page{
        padding-left:14px;
        padding-right:14px;
      }

      header{
        align-items:flex-start;
      }

      .status{
        font-size:8px;
      }

      h1{
        font-size:clamp(34px, 13vw, 54px);
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="grain"></div>

    <header>
      <div class="brand">
        <img
          src="https://raw.githubusercontent.com/QxDhanric/Production/refs/heads/main/qxdhanric.png"
          alt="QxDhanric"
        />
      </div>
      <div class="status">
        <span class="dot"></span>
        New home loading
      </div>
    </header>

    <main>
      <section class="content">
        <div class="eyebrow">Same QxDhanric. New home.</div>

        <h1>
          <span class="old">QxDhanric.online</span>
          <span class="arrow">→</span>
          <span class="new"><a class="new-link" href="https://qxdhanric.life/" target="_blank" rel="noopener noreferrer">QxDhanric.life</a></span>
        </h1>

        <p class="message">
          QxDhanric is now on <strong>QxDhanric.life</strong>.
        </p>

        <a class="cta" href="https://qxdhanric.life/" target="_blank" rel="noopener noreferrer">
          Visit QxDhanric.life <span aria-hidden="true">↗</span>
        </a>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> QxDhanric</span>
      <span class="countdown" id="statusText">QxDhanric.life</span>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const messages = [
      "QxDhanric.life",
      "New home. Same identity.",
      "QxDhanric is here."
    ];

    const statusText = document.getElementById("statusText");
    let index = 0;

    setInterval(() => {
      index = (index + 1) % messages.length;
      statusText.animate(
        [
          { opacity: 1, transform: "translateY(0)" },
          { opacity: 0, transform: "translateY(-4px)" }
        ],
        { duration: 220, fill: "forwards" }
      ).onfinish = () => {
        statusText.textContent = messages[index];
        statusText.animate(
          [
            { opacity: 0, transform: "translateY(4px)" },
            { opacity: 1, transform: "translateY(0)" }
          ],
          { duration: 220, fill: "forwards" }
        );
      };
    }, 3200);
  </script>
</body>
</html>
